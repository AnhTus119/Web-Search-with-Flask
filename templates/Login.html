{% extends "base.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block content %}
<div class="auth-card">
    <p class="eyebrow">Tài khoản</p>
    <h1>Đăng nhập</h1>
    <p class="muted">Đăng nhập để thanh toán và xem lại đơn hàng của bạn.</p>
    <form method="POST" class="checkout-form">
        <input type="hidden" name="next" value="{{ next_url or request.args.get('next', '') }}">
        <label>Tên đăng nhập hoặc email
            <input type="text" name="txt_username" required autofocus>
        </label>
        <label>Mật khẩu
            <input type="password" name="txt_password" required>
        </label>
        <button type="submit">Đăng nhập</button>
    </form>
    <div class="demo-accounts">
        <strong>Tài khoản học thử</strong>
        <span>Khách hàng: Anh Tú / 12345</span>
        <span>Quản trị: admin / admin123</span>
    </div>
</div>
{% endblock %}
